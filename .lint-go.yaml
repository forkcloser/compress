# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out. `just do lint go` renders the two on every run
# (book/linting-go.md, "one baseline, per-project carve-outs").
golangci:
  linters:
    exclusions:
      rules:
        # Tests are black-box consumers: the rules about API hygiene and
        # production robustness do not apply to them, the rules about
        # correctness do (errcheck stays on: a test that ignores an error can
        # pass for the wrong reason). The baseline already exempts tests from
        # gocognit, goconst, gosec, varnamelen and wrapcheck; these are the rest.
        - path: _test\.go
          linters:
            - dupl # test cases are meant to look alike
            - dupword # test data
            - err113 # dynamic errors are fine in fixtures
            - dogsled # multiple-return helpers are exercised for one value at a time
            - noctx # no cancellation to propagate
            - perfsprint # readability over allocations
            - mnd # fixture values
    settings:
      wrapcheck:
        # Errors from this module's own packages carry their context from
        # where they arise; re-wrapping them in every caller is noise.
        ignore-package-globs:
          - github.com/forkcloser/compress
          - github.com/forkcloser/compress/*
      depguard:
        rules:
          main:
            allow:
              # The codecs: zstd and gzip, xz, lz4. bzip2 is the standard library's.
              - github.com/klauspost/compress
              - github.com/forkcloser/xz
              - github.com/pierrec/lz4/v4
